name: Test notebook 03

on:
  push:
    paths:
      - "notebooks/afternoon/03*.ipynb"
      - "notebooks/afternoon/utils.py"
      - "environment.yml"
      - ".github/workflows/test-notebook-03.yml"
  pull_request:
    paths:
      - "notebooks/afternoon/03*.ipynb"
      - "notebooks/afternoon/utils.py"
      - "environment.yml"
      - ".github/workflows/test-notebook-03.yml"
  workflow_dispatch:

jobs:
  run-notebook-03:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: gvxr-dXCT2026
          auto-activate-base: false

      - name: Install notebook execution tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert nbclient ipykernel

      - name: Show environment
        run: |
          python --version
          python -c "import tensorflow as tf; print('TensorFlow:', tf.__version__)"
          python -c "import pooch; print('pooch:', pooch.__version__)"

      - name: Execute notebook 03
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/afternoon/03_live_inference_pretrained_unet.ipynb \
            --output executed_03_live_inference_pretrained_unet.ipynb \
            --ExecutePreprocessor.timeout=600

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-03
          path: notebooks/afternoon/executed_03_live_inference_pretrained_unet.ipynb
